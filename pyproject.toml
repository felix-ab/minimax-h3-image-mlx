[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-image-mlx"
version = "0.1.0"
description = "MiniMax-H3-Image (33B DiT, 16 MP, 6-step) on Apple Silicon with MLX: a faithful port, bf16 streamed from SSD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Felix Brener" }]
keywords = ["mlx", "apple-silicon", "text-to-image", "image-editing", "diffusion", "minimax-h3"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.32.4", "numpy", "pillow", "tokenizers", "huggingface_hub"]

[project.optional-dependencies]
test = ["pytest>=8"]
reference = ["torch>=2.15", "transformers>=5.22", "diffusers>=0.42"]

[project.scripts]
minimax-h3-mlx = "minimax_h3_mlx.cli:main"
minimax-h3-mlx-export = "minimax_h3_mlx.export:main"

[tool.setuptools]
packages = ["minimax_h3_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
